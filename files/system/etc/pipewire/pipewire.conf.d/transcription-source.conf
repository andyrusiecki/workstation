# Combined microphone and audio source for transcription
context.modules = [
    # 1. Create Virtual Source
    { name = libpipewire-module-loopback
      args = {
          node.name = "transcription_source"
          node.description = "Transcription Capture Source"
          media.class = Audio/Source/Virtual
          audio.position = [ FL FR ]
      }
    }
    # 2. Automatically loop default microphone
    { name = libpipewire-module-loopback
      args = {
          node.target = "@DEFAULT_AUDIO_SRC@"
          playback.props = { node.target = "transcription_source" }
      }
    }
    # 3. Automatically loop default system output monitor
    { name = libpipewire-module-loopback
      args = {
          node.target = "@DEFAULT_AUDIO_SINK@"
          playback.props = { node.target = "transcription_source" }
      }
    }
]
