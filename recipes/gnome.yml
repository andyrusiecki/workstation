---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: workstation
description: Personal workstation using GNOME

base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: 44

modules:
  - from-file: common-modules.yml

  - type: dnf
    install:
      packages:
        # GNOME additions
        - adw-gtk3-theme
        - ffmpegthumbnailer
        - gnome-tweaks

  - type: script
    scripts:
      - gnome-rounded-blur.sh

  - type: gnome-extensions
    install:
      - App Hider
      - AppIndicator and KStatusNotifierItem Support
      - Blur my Shell
      - Caffeine
      - Dash to Dock
      - Just Perfection
      - In Picture
      - Night Theme Switcher
      - Rounded Window Corners Reborn

  - type: gschema-overrides
    include:
      - desktop.gschema.override
      - extensions.gschema.override

  - type: signing
